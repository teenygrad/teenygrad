service: teenygrad-docs

image: artemissoft1/teenygrad-docs

ssh:
  user: kamal

registry:
  server: registry.hub.docker.com
  username: artemissoft1
  password:
    - KAMAL_REGISTRY_PASSWORD

servers:
  web:
    - 46.62.237.88

proxy:
  ssl: true
  host: docs.teenygrad.org
  app_port: 80

builder:
  arch: amd64
  context: docs-site
  # dockerfile resolves relative to the repo root (independently of
  # context), not <context>/Dockerfile -- must be explicit or Kamal falls
  # back to the unrelated root-level Dockerfile (full workspace CUDA build).
  dockerfile: docs-site/Dockerfile
