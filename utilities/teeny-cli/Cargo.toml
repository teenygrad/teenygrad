[package]
name = "teeny-cli"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_cli/"
keywords = ["cli", "machine-learning", "aot-compilation", "kernels"]
categories = ["command-line-utilities", "science"]

[features]
default = []
# Enables the "cuda" --device backend (teeny-cuda) and the smoke-test binary,
# which AOT-compiles teeny-vision's LeNet-5 against it.
cuda = ["dep:teeny-cuda", "dep:teeny-kernels", "teeny-kernels/cuda", "dep:teeny-vision"]
# Enables the "riscv" --device backend (teeny-riscv). Needs no CUDA toolkit: teeny-kernels is
# pulled in with its default (cuda) feature off. The smoke-test binary stays CUDA-only, since
# teeny-vision depends on teeny-cuda unconditionally.
riscv = ["dep:teeny-riscv", "dep:teeny-kernels", "teeny-kernels/riscv"]

[lib]

[[bin]]
name = "teeny-cli"
path = "src/main.rs"
required-features = ["cuda"]

[dependencies]
teeny-core.workspace = true
teeny-cuda = { workspace = true, optional = true }
teeny-riscv = { workspace = true, optional = true }
# A path dep rather than `workspace = true`: the workspace entry leaves `default-features` on, and
# teeny-kernels defaults to `cuda`, which a `riscv`-only build must not pull in.
teeny-kernels = { path = "../../kernels/teeny-kernels", version = "0.2.1", default-features = false, features = ["training"], optional = true }
teeny-vision = { workspace = true, optional = true }
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
