name: Deploy docs site

on:
  push:
    branches: [ main ]

jobs:
  deploy-docs:
    name: Build and deploy docs.teenygrad.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # teeny-onnx vendors its ONNX proto schema as a submodule.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # teeny-cuda's build.rs unconditionally runs bindgen against the CUDA
      # headers -- install the toolkit so docs-site/build.sh's `nvcc`
      # detection picks it up and includes teeny-cuda/teeny-kernels in the
      # deployed API docs (previously skipped for lack of a CUDA runner).
      # Only headers + stub libs are needed (no GPU/driver required for
      # `cargo doc`); pinned to CUDA 13.2 (the newest release confirmed to
      # actually exist -- 13.3 could not be verified as a real release).
      #
      # Installed directly via apt rather than the Jimver/cuda-toolkit
      # action: (1) as of v0.2.35 its version table tops out at 13.2.0, so
      # it can't target this release at all; (2) its default (empty)
      # sub-packages selection installs the full `cuda`/`cuda-demo-suite`
      # metapackages, which pull in the real nvidia-driver/nvidia-dkms
      # packages and fail to `dpkg --configure` on hosted runners (no
      # matching kernel to build DKMS modules against) -- confirmed via a
      # real failed run on 2026-07-28. Installing only the specific -dev
      # packages build.rs actually links against (cudart, nvrtc,
      # nvptxcompiler_static via nvcc, and the libcuda.so *stub* via
      # driver-dev) avoids the driver/dkms packages entirely.
      #
      # Two more gaps found later (2026-07-28, while building vision-rs's
      # equivalent workflow) that mean this step was NOT actually working
      # end-to-end despite runs reporting success -- docs.teenygrad.org's
      # API index has never actually included teeny_cuda/teeny_kernels:
      # (1) teeny-cuda's wrapper.h includes cuda_profiler_api.h directly,
      #     which lives in a separate apt package from cuda-cudart-dev
      #     (confirmed via `dpkg -S cuda_profiler_api.h`).
      # (2) installing the -dev packages does not put /usr/local/cuda/bin
      #     on PATH, so docs-site/build.sh's `command -v nvcc` check has
      #     been silently falling back to excluding teeny-cuda/teeny-kernels
      #     every single run.
      - name: Install CUDA toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 cuda-nvrtc-dev-13-2 cuda-driver-dev-13-2 cuda-profiler-api-13-2
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      - name: Install mdbook + mdbook-mermaid
        run: |
          cargo install mdbook --locked
          cargo install mdbook-mermaid --locked

      - name: Build docs site
        run: ./docs-site/build.sh

      - name: Set up SSH agent for Kamal
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Deploy via Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD:/workdir" -w /workdir \
            -v "$SSH_AUTH_SOCK:/ssh-agent" -e SSH_AUTH_SOCK=/ssh-agent \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e KAMAL_REGISTRY_PASSWORD \
            ghcr.io/basecamp/kamal:latest deploy
