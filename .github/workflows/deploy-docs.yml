name: Deploy docs site

on:
  push:
    branches: [ main ]

jobs:
  deploy-docs:
    name: Build and deploy docs.teenygrad.org
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # teeny-onnx vendors its ONNX proto schema as a submodule.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # teeny-cuda's build.rs unconditionally runs bindgen against the CUDA
      # headers -- install the toolkit so docs-site/build.sh's `nvcc`
      # detection picks it up and includes teeny-cuda/teeny-kernels in the
      # deployed API docs (previously skipped for lack of a CUDA runner).
      # Only the headers/stub libs are needed (no GPU/driver required for
      # `cargo doc`); pinned to a widely-available CUDA 12.x release rather
      # than matching any particular dev machine's version, since bindgen
      # output only needs to be API-compatible, not an exact match.
      # NOTE: unverified -- this repo has no way to test a live GitHub
      # Actions run; if this action/version stops working, check
      # https://github.com/Jimver/cuda-toolkit for current options.
      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.6.0'
          method: network

      - name: Install mdbook + mdbook-mermaid
        run: |
          cargo install mdbook --locked
          cargo install mdbook-mermaid --locked

      - name: Build docs site
        run: ./docs-site/build.sh

      - name: Set up SSH agent for Kamal
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.KAMAL_SSH_PRIVATE_KEY }}

      - name: Deploy via Kamal
        env:
          KAMAL_REGISTRY_PASSWORD: ${{ secrets.KAMAL_REGISTRY_PASSWORD }}
        run: |
          docker run --rm \
            -v "$PWD:/workdir" -w /workdir \
            -v "$SSH_AUTH_SOCK:/ssh-agent" -e SSH_AUTH_SOCK=/ssh-agent \
            -e KAMAL_REGISTRY_PASSWORD \
            ghcr.io/basecamp/kamal:latest deploy
