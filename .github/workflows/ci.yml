name: Rust CI

on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  # Crates that build with a plain stable toolchain (plus the CUDA toolkit
  # installed below). Excluded on purpose rather than silently broken:
  #   - teeny-torch: PyO3 cdylib extension module, not part of the crates.io
  #     publish set (publish = false) — excluded to keep this job focused on
  #     the publishable Rust SDK; Python packaging is a separate concern.
  build-test-clippy:
    name: Build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # teeny-onnx vendors the ONNX proto schema as a git submodule
          # (support/teeny-onnx/onnx) — needed for its build.rs to run.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      # teeny-cuda's build.rs unconditionally runs bindgen against the CUDA
      # toolkit headers (no feature gate to skip it); teeny-kernels' default
      # features enable teeny-cuda. Only the -dev packages actually linked
      # against are installed here — no driver/dkms — since this runner has
      # no GPU to run anything on, just needs the headers to compile. Same
      # recipe as release-plz.yml.
      - name: Install CUDA toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 cuda-nvrtc-dev-13-2 cuda-driver-dev-13-2 cuda-profiler-api-13-2
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"

      # test_compile (compiler/teeny-compiler) shells out to the teenyc compiler
      # (rustc's `-Zcodegen-backend=mlir`) to actually compile a kernel to PTX —
      # it's a pure codegen test, no live GPU needed (see find_teenyc() /
      # compile_kernel). cargo-teeny downloads a prebuilt teenyc release from
      # the spinorml CDN and links it as a named rustup toolchain (see
      # https://github.com/spinorml/cargo-teeny) — no from-source rustc build.
      - name: Install teenyc toolchain
        run: |
          cargo install cargo-teeny
          cargo teeny install-toolchain

      - name: Build
        run: cargo build --workspace --exclude teeny-torch

      - name: Clippy
        run: cargo clippy --workspace --exclude teeny-torch -- -D warnings

      - name: Test
        # teeny-cuda, teeny-triton, and teeny-vision all have tests that open a
        # real CUDA device (teeny_cuda::testing::setup_cuda_env) to compile and
        # run kernels on — this runner has the toolkit to *compile* against
        # (installed above) but no GPU to run anything on, so those crates stay
        # excluded here even though Build/Clippy above now cover them.
        #
        # teeny-kernels instead gates any test that needs a real device behind
        # its own `hardware` feature (orthogonal to `cuda`/`riscv`, which only
        # mean "compile for this target"), so it's run explicitly below for
        # both backends with `hardware` off — this exercises every
        # compile-only snapshot test against both `Sm89` (cuda) and
        # `GenericRvv1_0` (riscv) with no GPU or RISC-V hardware needed. `riscv`
        # is combined with `training` since the library itself isn't yet clean
        # under `riscv` alone (see teeny-kernels/src/graph/mod.rs's training-
        # gated imports) — that combination was never a supported target and is
        # left as a follow-up.
        run: >
          cargo test --workspace
          --exclude teeny-cuda
          --exclude teeny-kernels
          --exclude teeny-torch
          --exclude teeny-triton --exclude teeny-vision

      - name: Test teeny-kernels (cuda)
        run: cargo test -p teeny-kernels --features cuda

      - name: Test teeny-kernels (riscv)
        run: cargo test -p teeny-kernels --no-default-features --features riscv,training

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Doc build
        run: cargo doc --workspace --no-deps --exclude teeny-torch

  # The books (books/*) keep their code samples in the crates they document and
  # pull them in with {{#include}}, so a rename or a moved anchor breaks a
  # published page without touching a .md file. This catches that here rather
  # than on the docs deploy.
  #
  # It cannot build the examples themselves: they carry
  # `required-features = ["cuda"]` and need the CUDA toolkit and a real device,
  # which this runner has neither of — the same reason teeny-cuda and
  # teeny-kernels are excluded above. Until there is a CUDA-provisioned runner,
  # an example is verified by running it by hand:
  #
  #   cargo run -p teeny-triton --features cuda --example vector_add
  book-includes:
    name: Book stays in step with the code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check every {{#include}} points at a real file and anchor
        run: python3 books/check-includes.py

      # The kernels book's reference section documents every method on the
      # `Triton` trait. Adding one without documenting it leaves a hole a
      # reader finds before a maintainer does.
      - name: Check the Triton translation table is complete
        run: python3 books/check-triton-table.py
