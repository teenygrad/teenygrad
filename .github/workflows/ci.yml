name: Rust CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Crates that build with a plain stable toolchain and no system dependencies.
  # Excluded on purpose (see comments below, and the teeny-cuda follow-up
  # issue) rather than silently broken:
  #   - teeny-cuda, teeny-kernels: teeny-cuda's build.rs unconditionally runs
  #     bindgen against the CUDA toolkit headers (no feature gate to skip it);
  #     teeny-kernels' default features enable teeny-cuda. Needs a
  #     CUDA-toolkit-provisioned runner — tracked separately, not yet set up.
  #   - teeny-torch: PyO3 cdylib extension module, not part of the crates.io
  #     publish set (publish = false) — excluded to keep this job focused on
  #     the publishable Rust SDK; Python packaging is a separate concern.
  build-test-clippy:
    name: Build, test, clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # teeny-onnx vendors the ONNX proto schema as a git submodule
          # (support/teeny-onnx/onnx) — needed for its build.rs to run.
          submodules: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: >
          cargo build --workspace
          --exclude teeny-cuda --exclude teeny-kernels
          --exclude teeny-torch

      - name: Clippy
        run: >
          cargo clippy --workspace
          --exclude teeny-cuda --exclude teeny-kernels
          --exclude teeny-torch
          -- -D warnings

      - name: Test
        # teeny-triton and teeny-vision are additionally excluded here (but
        # not from the Build/Clippy steps above): their [dev-dependencies]
        # pull in teeny-cuda (teeny-triton, directly) / teeny-kernels
        # (teeny-vision, transitively enabling teeny-cuda) only when building
        # test targets, which `cargo build`/`cargo clippy` (without
        # `--all-targets`) don't do.
        run: >
          cargo test --workspace
          --exclude teeny-cuda --exclude teeny-kernels
          --exclude teeny-torch
          --exclude teeny-triton --exclude teeny-vision

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Doc build
        run: >
          cargo doc --workspace --no-deps
          --exclude teeny-cuda --exclude teeny-kernels
          --exclude teeny-torch

  # The books (books/*) keep their code samples in the crates they document and
  # pull them in with {{#include}}, so a rename or a moved anchor breaks a
  # published page without touching a .md file. This catches that here rather
  # than on the docs deploy.
  #
  # It cannot build the examples themselves: they carry
  # `required-features = ["cuda"]` and need the CUDA toolkit and a real device,
  # which this runner has neither of — the same reason teeny-cuda and
  # teeny-kernels are excluded above. Until there is a CUDA-provisioned runner,
  # an example is verified by running it by hand:
  #
  #   cargo run -p teeny-triton --features cuda --example vector_add
  book-includes:
    name: Book stays in step with the code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check every {{#include}} points at a real file and anchor
        run: python3 books/check-includes.py

      # The kernels book's reference section documents every method on the
      # `Triton` trait. Adding one without documenting it leaves a hole a
      # reader finds before a maintainer does.
      - name: Check the Triton translation table is complete
        run: python3 books/check-triton-table.py
