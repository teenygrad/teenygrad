name: Release-plz

permissions:
  contents: write

on:
  push:
    branches:
      - main
  # TEMPORARY, for verifying the CUDA/submodule fix on this branch without
  # risking a real crates.io publish -- revert once confirmed.
  workflow_dispatch:

jobs:
  # Publishes any packages whose version was already bumped by a merged
  # release-plz PR (see the release-plz-pr job below).
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # teeny-onnx vendors its ONNX proto schema as a submodule --
          # needed for its build.rs to run during `cargo publish`'s package
          # verification.
          submodules: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # teeny-cuda's build.rs unconditionally runs bindgen against real CUDA
      # headers -- without this, publishing teeny-cuda (and packaging it as
      # part of verifying any crate that depends on it) fails. Same recipe
      # as ci.yml: only the -dev packages actually linked against, no
      # driver/dkms, nvcc explicitly put on PATH.
      - name: Install CUDA toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 cuda-nvrtc-dev-13-2 cuda-driver-dev-13-2 cuda-profiler-api-13-2
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
          # TEMPORARY: exercises full package+build verification for every
          # crate (including teeny-onnx/teeny-cuda) without uploading to
          # crates.io. Revert once confirmed.
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Opens/updates a PR with the next version bump + changelog for review.
  # Merging that PR is what triggers release-plz-release above.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-plz.toml sets pr_labels = ["release"], which doesn't exist
      # yet on this repo -- creating a missing label goes through the
      # Issues API even for a PR, so pull-requests: write alone isn't
      # enough.
      issues: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # teeny-onnx vendors its ONNX proto schema as a submodule --
          # needed for its build.rs to run (semver_check = true in
          # release-plz.toml means release-pr also compiles crates via
          # cargo-semver-checks).
          submodules: true
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      # teeny-cuda's build.rs unconditionally runs bindgen against real CUDA
      # headers -- semver_check needs to compile it too. Same recipe as
      # ci.yml.
      - name: Install CUDA toolkit
        run: |
          wget https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb -O /tmp/cuda-keyring.deb
          sudo dpkg -i /tmp/cuda-keyring.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-13-2 cuda-cudart-dev-13-2 cuda-nvrtc-dev-13-2 cuda-driver-dev-13-2 cuda-profiler-api-13-2
          echo "/usr/local/cuda/bin" >> "$GITHUB_PATH"
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
