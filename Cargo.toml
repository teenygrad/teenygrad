[workspace]
resolver = "3"
members = [
  "core/*",
  "kernels/*",
  "macros/*",
  "models/*",
  "support/*",
  "drivers/*",
  "utilities/*",
  "apps/*",
  "compiler/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
description = "Teenygrad is a high-performance, memory-safe Rust ML training and inference library. It targets devices from microcontrollers to traditional GPUs with statically-typed kernels and full async support."
repository = "https://github.com/teenygrad/teenygrad"
homepage = "https://teenygrad.org"
readme = "README.md"

[workspace.dependencies]
teeny-core = { path = "core/teeny-core", version = "0.1.3" }
teeny-macros = { path = "macros/teeny-macros", version = "0.1.3" }
teeny-triton = { path = "kernels/teeny-triton", version = "0.1.3" }
teeny-kernels = { path = "kernels/teeny-kernels", version = "0.1.3" }
teeny-fxgraph = { path = "support/teeny-fxgraph", version = "0.1.3" }
teeny-compiler = { path = "compiler/teeny-compiler", version = "0.1.3" }
teeny-cuda = { path = "drivers/teeny-cuda", version = "0.1.3" }
teeny-vision = { path = "models/teeny-vision", version = "0.1.3" }

anyhow = { version = "1.0.100", default-features = false }
thiserror = { version = "2.0.18", default-features = false }
sha2 = { version = "0.11.0", default-features = false }
fd-lock = "4.0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
safetensors = { version = "0.7" }
protobuf = "3.7.2"
protobuf-codegen = "3.7.2"
protoc-bin-vendored = "3.2.0" 
syn = { version = "2.0.111", features = ["full"] }
quote = "1.0.42"
proc-macro2 = "1.0.103"
tokio = { version = "1.52.1", features = ["full"] }
smol = { version = "2.0.2" }
fancy-regex = "0.17.0"
rustc-hash = "2.1.2"
regex = "1.12.2"
bstr = "1.12.1"
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
chrono = "0.4.41"
clap = { version = "4.5.53", features = ["derive"] }
minijinja = "2.13.0"
minijinja-contrib = { version = "2.13.0", features = ["pycompat"] }
tokenizers = "0.22.2"
ndarray = "0.17.1"
ndarray-rand = "0.16.0"
csv = "1.4.0"
once_cell = "1.21.3"
rand = { version = "0.10.1", features = ["std"] }
derive_builder = "0.20.2"
uuid = { version = "1.19.0", features = ["v4"] }
tracing = "0.1.43"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
cargo_metadata = "0.23.1"
bindgen = "0.72.1"
cfgrammar = "0.14.0"
lrlex = "0.14.0"
lrpar = "0.14.0"
rayon = "1.11.0"
half = "2.7.1"
target-triple = "1.0.0"
cpuid = "0.1.1"
num-traits = "0.2.19"
derive_more = { version = "2.1.0", features = ["full"] }
ksuid = "0.2.0"
insta = "1.47.2"
criterion = { version = "0.8", features = ["html_reports"] }
indicatif = "0.18.3"
memmap2 = "0.9.9"
flatbuffers = "25.12.19"
flatc-rust = "0.2.0"
# Force nightly feature so hashbrown 0.16 builds on nightly (allocator_api). Required by safetensors/indexmap.
# hashbrown = { version = "0.16.1", features = ["nightly"] }
pyo3 = { version = "0.28.3", features = ["extension-module"] }
pyo3-build-config = "0.28.3"
egg = "0.11.0"
flate2 = "1.1.9"
ordered-float = "5.3.0"
dotenv = "0.15.0"
parquet = { version = "54", features = ["arrow"] }
arrow-array = "54"

