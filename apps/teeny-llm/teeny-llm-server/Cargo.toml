[package]
name = "teeny-llm-server"
version.workspace = true
edition.workspace = true
description = "OpenAI-compatible HTTP API server for teenygrad LLM inference (chat completions, completions, embeddings, models)."
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_llm_server/"
keywords = ["llm", "inference", "server", "openai", "openapi"]
categories = ["science", "web-programming::http-server"]
# The Vue webapp scaffolds aren't part of the Rust build; keep them out of the published crate.
exclude = ["webapps/"]

[[bin]]
name = "teeny-llm-server"
path = "src/main.rs"

[features]
# No model by default, so the binary builds anywhere (and its tests need no GPU driver).
# Add a model and its backend: `--features functiongemma3,cuda` (or `riscv`, `qemu`).
default = []
functiongemma3 = ["teeny-llm-core/functiongemma3"]
cuda = ["teeny-llm-core/cuda"]
riscv = ["teeny-llm-core/riscv"]
qemu = ["teeny-llm-core/qemu"]

[dependencies]
teeny-llm-core = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
axum = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
