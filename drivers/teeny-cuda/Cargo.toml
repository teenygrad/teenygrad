[package]
name = "teeny-cuda"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_cuda/"
keywords = ["cuda", "gpu", "machine-learning", "kernels"]
categories = ["hardware-support", "science", "external-ffi-bindings"]

[package.metadata.docs.rs]
# build.rs unconditionally links against the CUDA toolkit (bindgen against
# /usr/local/cuda/include, links cuda/cudart/nvrtc/nvptxcompiler_static), which
# docs.rs's sandbox does not provide. Disable the docs.rs build entirely rather
# than emit a red "build failed" badge; API docs are self-hosted instead at
# https://docs.teenygrad.org/api/teenygrad/teeny_cuda/.
targets = []

[features]
default = ["training"]
training = ["teeny-core/training"]

[lib]

[dependencies]
teeny-core.workspace = true
teeny-compiler.workspace = true
thiserror.workspace = true
anyhow.workspace = true
derive_more.workspace = true
derive_builder.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
teeny-kernels = { path = "../../kernels/teeny-kernels" }
teeny-test = { workspace = true, features = ["cuda"] }
dotenv.workspace = true

[build-dependencies]
bindgen.workspace = true
