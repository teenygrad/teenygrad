[package]
name = "teeny-riscv"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_riscv/"
keywords = ["riscv", "cpu", "machine-learning", "kernels"]
categories = ["hardware-support", "science", "external-ffi-bindings"]

[lib]

[features]
# On a non-RISC-V host, runs kernels launched through `RiscvDevice` under `qemu-riscv64` user-mode
# emulation -- needs a RISC-V cross C compiler and QEMU on the host. Without it, launching a kernel
# there panics. A riscv64 build always launches natively, in-process, and ignores this. Compiling
# for RISC-V needs neither and is always available.
#
# This crate's tests always get `teeny-test`'s QEMU helpers (enabled on the dev-dependency below),
# which only need QEMU when called. They aren't enabled from here: release-plz treats a
# dev-dependency a feature names as one to release first, and teeny-test depends on teeny-riscv.
qemu = []

[dependencies]
teeny-core.workspace = true
teeny-compiler.workspace = true
thiserror.workspace = true
anyhow.workspace = true
libloading.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
teeny-kernels = { path = "../../kernels/teeny-kernels" }
teeny-test = { workspace = true, features = ["riscv", "qemu"] }
dotenv.workspace = true
