[package]
name = "teeny-onnx"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_onnx/"
keywords = ["onnx", "machine-learning", "model-format", "protobuf"]
categories = ["science", "parser-implementations", "encoding"]

# The `onnx` git submodule (support/teeny-onnx/onnx) vendors the ENTIRE
# upstream onnx/onnx repo (~80MB at time of writing: C++/Python source, docs,
# and a large test-model corpus under onnx/onnx/backend/) so build.rs can
# read onnx/onnx/onnx.proto3. Only the *.proto3 schema files are actually
# needed at build time — without this allowlist, `cargo package` would
# include the whole submodule in the published tarball.
include = [
  "src/**",
  "build.rs",
  "Cargo.toml",
  "README.md",
  "onnx/onnx/*.proto3",
]

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
protobuf.workspace = true
teeny-core.workspace = true

[build-dependencies]
protobuf-codegen.workspace = true
protoc-bin-vendored.workspace = true 
