[package]
name = "teeny-kernels"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_kernels/"
keywords = ["kernels", "gpu", "attention", "machine-learning"]
categories = ["science", "algorithms"]

[lib]

[features]
default = ["cuda", "training"]
cuda = ["dep:teeny-cuda", "teeny-test/cuda"]
riscv = ["dep:teeny-riscv", "teeny-test/riscv"]
qemu = ["teeny-test/qemu"]
training = ["teeny-core/training"]

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
teeny-macros.workspace = true
teeny-core.workspace = true
teeny-triton.workspace = true
teeny-cuda = { workspace = true, optional = true }
# Only used by tests (see the `riscv` feature) -- optional dev-dependencies aren't supported by
# Cargo, so this lives here instead, same as `teeny-cuda` above.
teeny-riscv = { workspace = true, optional = true }

[dev-dependencies]
teeny-compiler = { path = "../../compiler/teeny-compiler" }
teeny-test.workspace = true
dotenv.workspace = true
insta.workspace = true
criterion.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# `benches/conv2d_bn_silu.rs` kept on disk as reference; not registered while
# `nn/fused` is unlinked from the crate.