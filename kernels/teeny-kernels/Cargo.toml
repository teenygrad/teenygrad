[package]
name = "teeny-kernels"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_kernels/"
keywords = ["kernels", "gpu", "attention", "machine-learning"]
categories = ["science", "algorithms"]

[lib]

[features]
default = ["cuda", "training"]
cuda = ["dep:teeny-cuda"]
training = ["teeny-core/training"]

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
teeny-macros.workspace = true
teeny-core.workspace = true
teeny-triton.workspace = true
teeny-cuda = { workspace = true, optional = true }

[dev-dependencies]
teeny-compiler = { path = "../../compiler/teeny-compiler" }
dotenv.workspace = true
insta.workspace = true
criterion.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

