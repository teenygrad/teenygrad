[package]
name = "teeny-test"
version.workspace = true
edition.workspace = true
description.workspace = true
repository.workspace = true
license.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.teenygrad.org/api/teenygrad/teeny_test/"
keywords = ["testing", "kernels", "cuda", "riscv", "machine-learning"]
categories = ["development-tools::testing", "science"]

[lib]

[features]
default = []
cuda = ["dep:teeny-cuda", "dep:teeny-runtime", "teeny-runtime/cuda"]
riscv = ["dep:teeny-riscv", "dep:teeny-runtime", "teeny-runtime/riscv"]
# Meaningful only combined with `riscv`. `qemu-harness` gates just the `riscv::qemu` submodule,
# which shells out to `qemu-riscv64` and a `riscv64-linux-gnu-gcc` cross toolchain to execute a
# compiled kernel rather than just compiling it. `qemu` adds making `model::RuntimeModel` (and
# every teeny-riscv device launch in the build) run under qemu, via `teeny-runtime/qemu`.
#
# teeny-riscv's own tests take `qemu-harness`, not `qemu`: `qemu` turns teeny-riscv's `qemu`
# feature on, which would make a plain `cargo test --workspace` run its QEMU tests.
qemu-harness = []
qemu = ["qemu-harness", "teeny-runtime?/qemu"]

[dependencies]
teeny-core.workspace = true
teeny-cuda = { workspace = true, optional = true }
teeny-riscv = { workspace = true, optional = true }
# Backs `model::RuntimeModel`. Not `workspace = true`, for the same reason as teeny-kernels':
# teeny-runtime's default `cuda` feature must stay off for a `riscv`-only build.
teeny-runtime = { path = "../../runtime/teeny-runtime", version = "0.3.3", optional = true, default-features = false }
anyhow.workspace = true
thiserror.workspace = true
